services:
  - type: web
    name: news-api
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    region: frankfurt
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: your_jwt_secret_here
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:5173