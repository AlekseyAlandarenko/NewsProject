services:
  app:
    build: .
    container_name: news-api
    restart: always
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      - DOCKER_ENV=true
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: